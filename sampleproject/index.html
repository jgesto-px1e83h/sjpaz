<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
<body>


<audio id="song" autoplay>
    <source src="backtofriends.mp3" type="audio/mpeg">
</audio>

<button class="mscBtnb" onclick="playMusic();openLyrics();">pindutin mo!</button>

<div id="lyrics" class="lyrics">
    <div class="lyrics-content">
        <h2 id="lyrics-xml"><h2>

</div>

</div>


<script>
function playMusic(){
    document.getElementById("song").play();
}

function openLyrics() {
    document.getElementById("lyrics").style.display = "block";

    const lyrics = [
        { time: 1270, text: "how" },
        { time: 1810, text: "can" },
        { time: 2350, text: "we" },
        { time: 2600, text: "go" },
        { time: 3660, text: "back" },
        { time: 4200, text: "to" },
        { time: 4730, text: "being" },
        { time: 5000, text: "friends" },
        { time: 6070, text: "when" },
        { time: 6320, text: "we" },
        { time: 7120, text: "just" },
        { time: 7650, text: "shared" },
        { time: 8440, text: "a" },
        { time: 8710, text: "bed" },
        { time: 11650, text: "how" },
        { time: 12160, text: "can" },
        { time: 12430, text: "you" },
        { time: 12970, text: "look" },
        { time: 13760, text: "happy" },
        { time: 14560, text: "and" },
        { time: 15350, text: "prentend" },
        { time: 16420, text: "im" },
        { time: 16690, text: "someone" },
        { time: 17480, text: "you've" },
        { time: 18550, text: "never" },
        { time: 19070, text: "met" },
    ];

    lyrics.forEach(line => {
        setTimeout(() => {
            document.getElementById("lyrics-xml").textContent = line.text;
        }, line.time);
    });
}

  



</script>

</body>
</html>
